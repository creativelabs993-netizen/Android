name: CoinForge PoW prototype tests

on:
  push:
    branches: [coinforge-testnet-prototype]
    paths:
      - 'coinforge-node/**'
      - '.github/workflows/coinforge-prototype.yml'
  pull_request:
    paths:
      - 'coinforge-node/**'
      - '.github/workflows/coinforge-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run proof-of-work prototype tests
        working-directory: coinforge-node
        run: python -m unittest -v
